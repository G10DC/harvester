[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harvester"
version = "0.1.0"
description = "Professional web scraping and structured data extraction engine with schema validation, rate limiting, and Sieve persistence"
authors = [
    { name = "G10DC", email = "g10dc@github.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scraping", "web-scraping", "sieve", "antigravity", "schema-validation", "etl"]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.18.0"
]

[project.scripts]
harvester = "scripts.harvester:main"

[project.urls]
Homepage = "https://github.com/G10DC/harvester"
Repository = "https://github.com/G10DC/harvester"
